tag: ready
github_url: https://github.com/SAP/jfrevents
github_pages: https://sap.github.io/jfrevents/
tagline: Reference website listing every JFR event type across JDK versions — field names, types,
  descriptions, and benchmark-derived examples showing which events fire and at what rate.
tagline_short: Reference website for every JFR event type across JDK versions.
features:
- Every JFR event type documented with field names, types, and descriptions
- Cross-version availability — see which events exist in which JDK versions
- Benchmark-derived examples showing real-world event rates
- Searchable and browsable by category (GC, JIT, IO, Thread, …)
no_release: true
note: Maintained by the SAP SapMachine team.
